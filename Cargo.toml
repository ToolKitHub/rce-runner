[package]
name = "rce-runner"
version = "1.2.4"
edition = "2024"
authors = ["ToolKitHub <xosnrdev@gmail.com>"]
description = """
A command line application that reads code as a json payload from stdin, compiles and runs the code, and writes
the result as json to stdout.
"""
repository = "https://github.com/ToolKitHub/rce-runner"
license = "MIT"

[dependencies]
serde = { version = "1.0.116", features = ["derive"] }
serde_json = "1.0.58"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
# See default profiles: https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
codegen-units = 1          # reduces binary size by ~2%
lto = true                 # reduces binary size by ~14%
panic = "abort"            # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed" # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"          # See split-debuginfo - allows us to drop the size by ~65%
incremental = true         # Improves re-compile times
